[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "clap"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "pytest>=9.0.1",
]

[tool.setuptools.package-data]
clap = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 79
